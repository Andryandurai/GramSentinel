services:
  backend:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    environment:
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-dev-only-compose-key}
      DEBUG: ${DEBUG:-False}
      ALLOWED_HOSTS: localhost,127.0.0.1,0.0.0.0,backend
      CORS_ALLOWED_ORIGINS: http://localhost:5173,http://localhost:8080
      # LLM is optional — the platform is fully functional without a key.
      LLM_ENABLED: ${LLM_ENABLED:-False}
      LLM_API_KEY: ${LLM_API_KEY:-}
    ports:
      - "8000:8000"
    volumes:
      - gramsentinel-db:/app/backend

  frontend:
    build:
      context: .
      dockerfile: docker/Dockerfile.frontend
    ports:
      - "8080:80"
    depends_on:
      - backend

volumes:
  gramsentinel-db:
